[package]
name = "ateam-common-packets"
version = "2.0.0"
edition = "2021"
description = "Rust-first radio packet definitions for the A-Team firmware"
repository = "https://github.com/SSL-A-Team/common"

[lib]
bench = false
path = "src/lib.rs"

[dependencies]
ateam-common-packets-macros = { path = "../macros" }
nalgebra = { version = "0.34.0", default-features = false, features = ["libm", "macros"] }
